<!doctype html>
<!-- From the workspace root after Nuxt has generated its types:
     node node_modules/.pnpm/node_modules/vite/bin/vite.js apps/web --host 127.0.0.1
     Open /app/lib/art/contact-sheet.html on the printed loopback URL. -->
<html lang="en">
<meta charset="utf-8">
<title>Inherit · Workshop equipment</title>
<body style="margin:0;background:#171e20">
<script type="module">
  import { Application, Graphics, Text } from 'pixi.js'
  import { machineArt, materialArt } from '../machineArt'
  const app = new Application()
  await app.init({ width: 1000, height: 726, background: 0x171e20, antialias: true, autoStart: false })
  document.body.append(app.canvas)
  function label(value, x, y, size, color, mono = false) {
    const text = new Text({ text: value, style: {
      fontFamily: mono ? 'monospace' : 'sans-serif', fontSize: size,
      fontWeight: mono ? '500' : 'bold', fill: color, letterSpacing: mono ? 0.6 : 0,
    } })
    text.position.set(x, y)
    app.stage.addChild(text)
  }
  label('Workshop equipment', 32, 19, 29, 0xe1dfce)
  label('INHERIT  /  FACTORY CATALOG', 720, 32, 14, 0xb9a77e, true)
  const machines = [
    ['miner', 'iron'], ['miner', 'copper'], ['miner', 'coal'], ['furnace'], ['press'],
    ['cutter'], ['assembler'], ['splitter'], ['merger'], ['storage'],
    ['sorter'], ['scrap'], ['dock'], ['depot'], ['truck'],
  ]
  for (const [index, [kind, deposit]] of machines.entries()) {
    const x = 32 + (index % 5) * 190, y = 76 + Math.floor(index / 5) * 169
    const plate = new Graphics()
    plate.roundRect(x, y, 178, 130, 4).fill(0x293233).stroke({ color: 0x465150, width: 1 })
    app.stage.addChild(plate)
    const art = machineArt(kind, deposit)
    art.position.set(x + 89, y + 78)
    art.scale.set(1.65)
    app.stage.addChild(art)
    label(deposit ? kind + ' / ' + deposit : kind, x + 2, y + 135, 14, 0xc6c9b9, true)
  }
  label('Belt materials', 32, 591, 19, 0xe1dfce)
  const materials = ['iron-ore', 'copper-ore', 'coal', 'iron-ingot', 'copper-ingot', 'plate',
    'gear', 'wire', 'bracket', 'motor', 'part', 'defect']
  for (const [index, kind] of materials.entries()) {
    const x = 71 + index * 78
    const art = materialArt(kind === 'defect' ? 'gear' : kind, kind === 'defect')
    art.position.set(x, 653)
    art.scale.set(2.45)
    app.stage.addChild(art)
    label(kind, x - kind.length * 3.1, 682, 10, 0xc6c9b9, true)
  }
  app.render()
  document.body.dataset.ready = '15 machine sprites, 11 materials and a defect tag'
</script>
</body>
</html>
